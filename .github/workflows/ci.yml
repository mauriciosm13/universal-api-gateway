name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Fetch base branch
        if: github.event_name == 'pull_request'
        run: git fetch origin "${{ github.base_ref }}"

      - name: Run quality gate
        run: bash quality/scripts/quality-gate.sh

      - name: Upload coverage
        uses: actions/upload-artifact@v6
        with:
          name: coverage
          path: coverage.out

      - name: Upload quality report
        uses: actions/upload-artifact@v6
        with:
          name: quality-report
          path: |
            quality/reports/latest.md
            quality/reports/latest.json

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Build gateway
        run: go build -o bin/gateway ./cmd/gateway

      - name: Upload binary
        uses: actions/upload-artifact@v6
        with:
          name: gateway-linux-amd64
          path: bin/gateway

  kubernetes:
    name: Validate Kubernetes manifests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install kubectl
        run: |
          KUBECTL_VERSION=v1.30.5
          curl -LO "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl"
          chmod +x kubectl
          sudo mv kubectl /usr/local/bin/kubectl
          kubectl version --client

      - name: Kustomize build
        run: |
          kubectl kustomize deploy/kubernetes/base
          kubectl kustomize deploy/kubernetes/overlays/dev
          kubectl kustomize deploy/kubernetes/overlays/staging
          kubectl kustomize deploy/kubernetes/overlays/prod
