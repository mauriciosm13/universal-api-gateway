# Demo stack — gateway + 2 mock upstreams (Week 8 MVP).
# Run: docker compose -f docker-compose.demo.yml up --build
# Test: ./scripts/demo.sh

services:
  upstream-a:
    image: nginx:alpine
    volumes:
      - ./deploy/demo/upstream-a.conf:/etc/nginx/conf.d/default.conf:ro
    expose:
      - "80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 3s
      timeout: 2s
      retries: 5
      start_period: 3s

  upstream-b:
    image: nginx:alpine
    volumes:
      - ./deploy/demo/upstream-b.conf:/etc/nginx/conf.d/default.conf:ro
    expose:
      - "80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 3s
      timeout: 2s
      retries: 5
      start_period: 3s

  gateway:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${GATEWAY_PORT:-8080}:8080"
    environment:
      GATEWAY_HOST: "0.0.0.0"
      GATEWAY_PORT: "8080"
      GATEWAY_DEFAULT_UPSTREAM: "http://upstream-a:80,http://upstream-b:80"
      GATEWAY_PATH_ROUTES: "/api=http://upstream-a:80,http://upstream-b:80"
      GATEWAY_JWT_HMAC_SECRET: "demo-secret-min-32-characters-long!!"
      GATEWAY_RATE_LIMIT_RPS: "5"
      GATEWAY_RATE_LIMIT_BURST: "8"
      GATEWAY_RETRY_MAX: "0"
      OTEL_SDK_DISABLED: "true"
    depends_on:
      upstream-a:
        condition: service_healthy
      upstream-b:
        condition: service_healthy
