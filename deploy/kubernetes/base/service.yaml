apiVersion: v1
kind: Service
metadata:
  name: universal-api-gateway
  labels:
    app.kubernetes.io/name: universal-api-gateway
    app.kubernetes.io/component: gateway
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: universal-api-gateway
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
